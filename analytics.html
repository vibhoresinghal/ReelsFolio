<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#091A12">
    <title>Visits — ReelsFolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Momo+Trust+Display&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👋</text></svg>">
    <style>
        :root {
            --ink: #091A12;
            --line: rgba(255, 236, 210, 0.1);
            --cream: rgba(255, 244, 226, 0.92);
            --mute: rgba(255, 236, 210, 0.48);
            --dim: rgba(255, 236, 210, 0.28);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            background: var(--ink);
            color: var(--cream);
            font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse 70% 50% at 18% -10%, rgba(255, 220, 170, 0.07), transparent 58%),
                radial-gradient(ellipse 50% 40% at 92% 8%, rgba(118, 196, 148, 0.08), transparent 52%),
                #091A12;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.28;
            mix-blend-mode: soft-light;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        button, input, select { font: inherit; color: inherit; }

        .gate, .app { position: relative; z-index: 1; }
        .gate { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }

        .gate-card {
            width: min(420px, 100%);
            padding: 36px 32px 32px;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.035), transparent 42%), #10281c;
            box-shadow: inset 0 1px 0 rgba(255, 244, 226, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.35), 0 24px 50px rgba(0, 0, 0, 0.35);
        }

        .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); }
        h1, .display { font-family: 'Momo Trust Display', Inter, serif; font-weight: 400; letter-spacing: -0.03em; }
        .gate-card h1 { margin: 14px 0 10px; font-size: 42px; line-height: 0.95; }
        .lede { color: var(--mute); line-height: 1.55; font-size: 14px; }
        .gate-form { display: grid; gap: 12px; margin-top: 28px; }

        input, select {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 0;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.28);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.28), inset 0 0 0 1px rgba(255, 236, 210, 0.08);
            outline: none;
        }

        input[type="search"], select { height: 40px; border-radius: 10px; }
        select { cursor: pointer; appearance: none; }
        input:focus, select:focus { box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.28), inset 0 0 0 1px rgba(143, 212, 168, 0.4); }

        .stone {
            height: 48px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(180deg, #2a3d32, #1a2a21);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 0 1px rgba(0, 0, 0, 0.3), 0 10px 18px rgba(0, 0, 0, 0.22);
            cursor: pointer;
        }

        .error { min-height: 1.2em; color: #efb4a4; font-size: 13px; }
        .app { display: none; min-height: 100vh; }
        body.is-open .gate { display: none; }
        body.is-open .app { display: block; }

        .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 64px; }

        header.top {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        header.top h1 { font-size: 48px; line-height: 0.92; }
        .header-tools, .ranges, .filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .chip {
            height: 34px;
            padding: 0 12px;
            border: 0;
            border-radius: 999px;
            background: rgba(255, 244, 226, 0.05);
            color: var(--mute);
            box-shadow: inset 0 0 0 1px rgba(255, 236, 210, 0.08);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chip.is-on {
            color: var(--cream);
            background: rgba(143, 212, 168, 0.14);
            box-shadow: inset 0 0 0 1px rgba(143, 212, 168, 0.28);
        }

        .icon {
            width: 14px;
            height: 14px;
            flex: 0 0 14px;
            display: inline-block;
            vertical-align: -2px;
        }

        .chip .icon { width: 13px; height: 13px; }

        .summary {
            margin-bottom: 18px;
            color: var(--mute);
            font-size: 15px;
            line-height: 1.5;
        }

        .summary b { color: var(--cream); font-weight: 550; }

        .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

        .pill {
            padding: 7px 11px;
            border-radius: 999px;
            background: rgba(8, 20, 14, 0.7);
            box-shadow: inset 0 0 0 1px var(--line);
            color: var(--cream);
            font-size: 13px;
        }

        .pill em { color: var(--mute); font-style: normal; margin-left: 6px; }

        .layout {
            display: grid;
            grid-template-columns: minmax(300px, 0.9fr) 1.2fr;
            gap: 16px;
            min-height: 64vh;
        }

        .panel {
            border-radius: 20px;
            background: rgba(8, 20, 14, 0.62);
            box-shadow: inset 0 1px 0 rgba(255, 244, 226, 0.06), inset 0 0 0 1px var(--line);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            padding: 16px 18px 10px;
            color: var(--mute);
            font-size: 13px;
        }

        .tools { padding: 0 18px 12px; display: grid; gap: 8px; }
        .search-wrap { position: relative; }
        .search-wrap .icon {
            position: absolute;
            left: 12px;
            top: 13px;
            color: var(--mute);
            pointer-events: none;
        }
        .search-wrap input { padding-left: 34px; }
        .visits { overflow: auto; max-height: 68vh; }
        .detail { overflow: auto; max-height: 72vh; padding-bottom: 24px; }

        .visit {
            width: 100%;
            display: grid;
            grid-template-columns: 40px 1fr;
            gap: 12px;
            text-align: left;
            padding: 14px 16px;
            border: 0;
            background: transparent;
            cursor: pointer;
            box-shadow: inset 0 -1px 0 var(--line);
            align-items: start;
        }

        .visit:hover { background: rgba(143, 212, 168, 0.05); }
        .visit.is-on {
            background: rgba(143, 212, 168, 0.09);
            box-shadow: inset 3px 0 0 #8fd4a8, inset 0 -1px 0 var(--line);
        }
        .visit:focus-visible { outline: 2px solid rgba(143, 212, 168, 0.45); outline-offset: -2px; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(0, 0, 0, 0.28);
            box-shadow: inset 0 0 0 1px rgba(255, 236, 210, 0.1);
            font-size: 13px;
            font-weight: 600;
            color: var(--cream);
        }

        .visit.is-on .avatar {
            background: rgba(143, 212, 168, 0.18);
            box-shadow: inset 0 0 0 1px rgba(143, 212, 168, 0.35);
        }

        .visit-body { min-width: 0; display: grid; gap: 4px; }
        .row-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
        .visit strong { font-weight: 600; }
        .facts, .did {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            color: var(--mute);
            font-size: 12px;
        }
        .facts span, .did, .meta span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge {
            flex: 0 0 auto;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 3px 7px;
            border-radius: 999px;
            color: rgba(143, 212, 168, 0.9);
            box-shadow: inset 0 0 0 1px rgba(143, 212, 168, 0.22);
        }

        .badge.is-tab { color: rgba(255, 214, 160, 0.9); box-shadow: inset 0 0 0 1px rgba(255, 214, 160, 0.22); }
        .badge.is-back { color: var(--mute); box-shadow: inset 0 0 0 1px rgba(255, 236, 210, 0.12); }

        .story-hero { padding: 20px 22px 8px; }
        .story-hero h2 { font-size: 32px; margin: 8px 0 10px; }
        .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--mute); font-size: 13px; }

        .timeline { position: relative; margin: 12px 24px 0; padding-left: 18px; }
        .timeline::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 6px;
            bottom: 6px;
            width: 1px;
            background: rgba(255, 236, 210, 0.12);
        }

        .moment { position: relative; padding: 0 0 16px 14px; }
        .moment::before {
            content: '';
            position: absolute;
            left: -16px;
            top: 8px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6f9f80;
            box-shadow: 0 0 0 3px rgba(111, 159, 128, 0.18);
        }

        .moment time { display: block; color: var(--dim); font-size: 11px; letter-spacing: 0.04em; }
        .moment p { margin-top: 3px; line-height: 1.45; display: flex; align-items: flex-start; gap: 8px; }
        .empty { padding: 28px 22px; color: var(--mute); line-height: 1.65; }
        .pager { display: flex; justify-content: space-between; padding: 12px 18px 16px; color: var(--mute); font-size: 12px; }
        .pager button:disabled { opacity: 0.35; cursor: default; }

        @media (max-width: 860px) {
            header.top, .layout { display: grid; grid-template-columns: 1fr; }
            header.top h1 { font-size: 40px; }
            .visits, .detail { max-height: none; }
        }
    </style>
</head>
<body>
    <main class="gate" id="gate">
        <section class="gate-card">
            <p class="eyebrow">Private</p>
            <h1>Visits</h1>
            <p class="lede">A quiet room for who came through the folio. Use the password you set on the worker. This browser will remember it until you lock it.</p>
            <form class="gate-form" id="gateForm">
                <input id="tokenInput" type="password" name="password" autocomplete="current-password" placeholder="Password" required>
                <button class="stone" type="submit">Open</button>
                <p class="error" id="gateError"></p>
            </form>
        </section>
    </main>

    <div class="app" id="app">
        <div class="shell">
            <header class="top">
                <div>
                    <p class="eyebrow">ReelsFolio</p>
                    <h1 class="display">Who stopped by</h1>
                </div>
                <div class="header-tools">
                    <div class="ranges" id="ranges">
                        <button class="chip is-on" data-range="7d">7 days</button>
                        <button class="chip" data-range="30d">30 days</button>
                        <button class="chip" data-range="all">All</button>
                    </div>
                    <button class="chip" id="lockBtn" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Lock</button>
                </div>
            </header>

            <section class="summary" id="summary"></section>

            <div class="layout">
                <section class="panel">
                    <div class="panel-head">
                        <span>Guests</span>
                        <span id="listMeta"></span>
                    </div>
                    <div class="tools">
                        <div class="search-wrap">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                            <input id="searchInput" type="search" placeholder="Guest 12, HueRex, iPhone…" autocomplete="off">
                        </div>
                        <div class="filters" id="devices">
                            <button class="chip is-on" data-device="">All</button>
                            <button class="chip" data-device="desktop"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Desktop</button>
                            <button class="chip" data-device="phone"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>Phone</button>
                            <button class="chip" data-device="tablet"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg>Tablet</button>
                        </div>
                    </div>
                    <div class="visits" id="visits"></div>
                    <div class="pager" id="pager"></div>
                </section>
                <section class="panel detail" id="detail">
                    <p class="empty">The latest visit will open here.</p>
                </section>
            </div>
        </div>
    </div>

    <script>
        const WORKER = 'https://reelsfolio-likes.vibhoresinghal.workers.dev';
        const TOKEN_KEY = 'rf_analytics_token';
        const PAGE = 25;
        const CLIP_TITLES = {
            'landing-video': 'Intro',
            landing: 'Intro',
            t1v1: 'Acquisition on PayZapp',
            t1v2: 'Growth & Retention',
            t1v3: 'Unicorn Design System',
            t1v4: 'Neo',
            t2v1: 'HueRex',
            t3v1: 'Veronica',
            t4v1: 'Sakleshpur',
            t4v2: 'Delhi in a lapse',
            t4v3: 'Ladakh 2018',
        };
        const CATEGORIES = {
            landing: 'Landing',
            zeta: 'Zeta',
            personal: 'Personal',
            films: 'Films',
            life: 'Life',
        };

        let token = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || '';
        let range = '7d';
        let device = '';
        let query = '';
        let offset = 0;
        let selectedId = '';
        let searchTimer = 0;
        let sessionCache = [];

        const $ = (id) => document.getElementById(id);

        function icon(name) {
            const paths = {
                clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 1.5"/>',
                timer: '<path d="M10 4h4M12 4v3"/><circle cx="12" cy="14" r="6"/>',
                desktop: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
                phone: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
                tablet: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/>',
                play: '<path d="m8 6 10 6-10 6V6z"/>',
                heart: '<path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/>',
                link: '<path d="M10 13a5 5 0 0 0 7.5.5l2-2A5 5 0 0 0 12.5 5L11 6.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2A5 5 0 0 0 11.5 19L13 17.5"/>',
                grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
                user: '<circle cx="12" cy="8" r="3.2"/><path d="M5 19a7 7 0 0 1 14 0"/>',
                lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
            };
            return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${paths[name] || ''}</svg>`;
        }

        function deviceIcon(device) {
            if (device === 'phone') return icon('phone');
            if (device === 'tablet') return icon('tablet');
            return icon('desktop');
        }

        function eventIcon(action) {
            if (action === 'video_heartbeat' || action === 'video_view') return icon('play');
            if (action === 'like_toggle') return icon('heart');
            if (action === 'outbound_click') return icon('link');
            if (action === 'grid_open') return icon('grid');
            return icon('user');
        }

        function guestLabel(session) {
            return session.guest_number ? `Guest ${session.guest_number}` : 'Guest';
        }

        function visitKind(session) {
            if (session.is_tab) return { label: 'Tab', className: 'is-tab' };
            if ((session.visit_number || 1) > 1) return { label: 'Returned', className: 'is-back' };
            return { label: 'New', className: '' };
        }

        function visitLine(session) {
            const n = session.visit_number || 1;
            const total = session.visit_count || 1;
            if (session.is_tab) return `Tab · visit ${n} of ${total}`;
            if (n > 1) return `Visit ${n} of ${total}`;
            return 'First visit';
        }

        function withLocalGuests(sessions) {
            const first = new Map();
            for (const session of [...sessions].sort((a, b) => a.started_at - b.started_at)) {
                const vid = session.visitor_id || session.id;
                if (!first.has(vid)) first.set(vid, session.started_at);
            }
            const order = [...first.entries()].sort((a, b) => a[1] - b[1] || String(a[0]).localeCompare(String(b[0])));
            const guestByVid = new Map(order.map((entry, index) => [entry[0], index + 1]));
            const family = new Map();
            for (const session of sessions) {
                const vid = session.visitor_id || session.id;
                if (!family.has(vid)) family.set(vid, []);
                family.get(vid).push(session);
            }
            for (const list of family.values()) list.sort((a, b) => a.started_at - b.started_at);
            return sessions.map((session) => {
                const vid = session.visitor_id || session.id;
                const kin = family.get(vid) || [session];
                const visitNumber = Math.max(1, kin.findIndex((row) => row.id === session.id) + 1);
                const overlap = kin.some((other) => (
                    other.id !== session.id
                    && session.started_at < (other.ended_at || other.started_at)
                    && other.started_at < (session.ended_at || session.started_at)
                ));
                return {
                    ...session,
                    guest_number: session.guest_number || guestByVid.get(vid),
                    visit_number: session.visit_number || visitNumber,
                    visit_count: session.visit_count || kin.length,
                    is_tab: session.is_tab ?? overlap,
                };
            });
        }

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[char]));
        }

        function clipTitle(id) {
            return CLIP_TITLES[id] || id || 'a clip';
        }

        function prettyHost(value) {
            if (!value) return 'direct';
            try { return new URL(value).hostname.replace(/^www\./, ''); }
            catch { return value; }
        }

        function relTime(ts) {
            const delta = Date.now() - ts;
            const min = Math.round(delta / 60000);
            if (min < 1) return 'just now';
            if (min < 60) return `${min}m ago`;
            const hr = Math.round(min / 60);
            if (hr < 24) return `${hr}h ago`;
            const day = Math.round(hr / 24);
            return `${day}d ago`;
        }

        function clock(ts) {
            return new Date(ts).toLocaleString(undefined, {
                month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
            });
        }

        function duration(start, end) {
            const sec = Math.max(0, Math.round(((end || start) - start) / 1000));
            if (sec < 60) return `${sec}s`;
            return `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, '0')}s`;
        }

        function watchLabel(seconds) {
            const n = Math.round(Number(seconds) || 0);
            if (n < 60) return `${n}s`;
            return `${Math.floor(n / 60)}m ${String(n % 60).padStart(2, '0')}s`;
        }

        async function api(path) {
            const res = await fetch(`${WORKER}${path}`, {
                headers: { Authorization: `Bearer ${token}` },
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `Could not load (${res.status})`);
            return data;
        }

        function lastLine(session) {
            const payload = session.last_payload || {};
            switch (session.last_action) {
                case 'video_view': return `Opened ${clipTitle(payload.videoId)}`;
                case 'video_heartbeat': return `Watched ${clipTitle(payload.videoId)}`;
                case 'like_toggle': return payload.liked ? `Liked ${clipTitle(payload.videoId)}` : `Unliked ${clipTitle(payload.videoId)}`;
                case 'tab_visit': return `Opened ${CATEGORIES[payload.category] || payload.category || 'a chapter'}`;
                case 'grid_open': return 'Opened the grid';
                case 'outbound_click': return `Tapped ${payload.label || 'a link'}`;
                default: return 'Opened the folio';
            }
        }

        function momentCopy(event) {
            const p = event.payload || {};
            switch (event.action) {
                case 'session_start': return 'Opened the folio';
                case 'video_view': return `Opened ${clipTitle(p.videoId)}`;
                case 'video_heartbeat': return `Watched ${clipTitle(p.videoId)} for ${watchLabel(p.seconds)}`;
                case 'like_toggle': return p.liked ? `Liked ${clipTitle(p.videoId)}` : `Removed a like from ${clipTitle(p.videoId)}`;
                case 'tab_visit': return `Moved into ${CATEGORIES[p.category] || p.category || 'another chapter'}`;
                case 'grid_open': return 'Opened the grid';
                case 'outbound_click': return `Tapped ${p.label || 'an outbound link'}`;
                default: return event.action;
            }
        }

        function storyEvents(events) {
            const rows = events || [];
            const watchByClip = new Map();
            for (const event of rows) {
                if (event.action !== 'video_heartbeat') continue;
                const id = event.payload && event.payload.videoId;
                if (!id) continue;
                const prev = watchByClip.get(id) || { seconds: 0, ts: event.ts };
                prev.seconds += Number(event.payload.seconds) || 0;
                prev.ts = event.ts;
                watchByClip.set(id, prev);
            }

            const usedWatch = new Set();
            let sawArrival = false;
            const out = [];

            for (const event of rows) {
                if (event.action === 'session_start') {
                    if (sawArrival) continue;
                    sawArrival = true;
                    out.push(event);
                    continue;
                }
                if (event.action === 'video_heartbeat') continue;
                if (event.action === 'video_view') {
                    const id = event.payload && event.payload.videoId;
                    const watch = id && watchByClip.get(id);
                    if (watch && !usedWatch.has(id)) {
                        usedWatch.add(id);
                        out.push({
                            ts: watch.ts,
                            action: 'video_heartbeat',
                            payload: { videoId: id, seconds: watch.seconds },
                        });
                    } else if (!watch) {
                        out.push(event);
                    }
                    continue;
                }
                out.push(event);
            }

            for (const [id, watch] of watchByClip) {
                if (usedWatch.has(id)) continue;
                out.push({
                    ts: watch.ts,
                    action: 'video_heartbeat',
                    payload: { videoId: id, seconds: watch.seconds },
                });
            }

            return out.sort((a, b) => a.ts - b.ts);
        }

        function matchesQuery(session) {
            if (!query) return true;
            const hay = [
                guestLabel(session),
                String(session.guest_number || ''),
                lastLine(session),
                visitLine(session),
                session.device,
                session.os,
                session.browser,
                session.last_payload && session.last_payload.videoId,
                session.last_payload && clipTitle(session.last_payload.videoId),
            ].join(' ').toLowerCase();
            return hay.includes(query.toLowerCase());
        }

        function renderSummary(overview) {
            const visits = overview.visits || 0;
            const people = overview.visitors || visits;
            const watched = (overview.watch || []).reduce((sum, row) => sum + (Number(row.seconds) || 0), 0);
            const windowLabel = range === '30d' ? 'in the last 30 days' : range === 'all' ? 'in all' : 'in the last 7 days';
            const who = people < visits
                ? `<b>${visits}</b> visits from <b>${people}</b> ${people === 1 ? 'person' : 'people'} ${windowLabel}`
                : `<b>${visits}</b> ${visits === 1 ? 'visit' : 'visits'} ${windowLabel}`;
            const extra = watched ? ` · <b>${watchLabel(watched)}</b> watched` : '';
            const pills = (overview.watch || []).map((row) => (
                `<span class="pill">${esc(clipTitle(row.videoId))}<em>${esc(watchLabel(row.seconds))}</em></span>`
            )).join('');
            const outbound = (overview.outbound || []).map((row) => (
                `<span class="pill">Left for ${esc(row.label || 'a link')}<em>${row.n}</em></span>`
            )).join('');
            $('summary').innerHTML = `<p>${who}${extra}.</p><div class="pills">${pills}${outbound}</div>`;
        }

        function renderVisits(sessions, total) {
            const rows = sessions.filter(matchesQuery);
            $('listMeta').textContent = rows.length ? `${rows.length}` : '';
            if (!rows.length) {
                $('visits').innerHTML = '<p class="empty">No guests in this window.</p>';
            } else {
                $('visits').innerHTML = rows.map((session) => {
                    const kind = visitKind(session);
                    return `
                    <button class="visit${session.id === selectedId ? ' is-on' : ''}" data-id="${esc(session.id)}">
                        <span class="avatar">${esc(session.guest_number || '·')}</span>
                        <span class="visit-body">
                            <span class="row-top">
                                <strong>${esc(guestLabel(session))}</strong>
                                <em class="badge ${kind.className}">${kind.label}</em>
                            </span>
                            <span class="facts">
                                <span>${icon('clock')} ${esc(relTime(session.started_at))}</span>
                                <span>${icon('timer')} ${esc(duration(session.started_at, session.ended_at))}</span>
                                <span>${deviceIcon(session.device)} ${esc(session.browser || 'browser')} · ${esc(session.os || session.device || 'web')}</span>
                            </span>
                            <span class="did">${eventIcon(session.last_action)} ${esc(visitLine(session))} · ${esc(lastLine(session))}</span>
                        </span>
                    </button>`;
                }).join('');
            }

            const knownTotal = Number(total) || sessions.length;
            const newerOff = offset <= 0;
            const olderOff = offset + sessions.length >= knownTotal;
            $('pager').innerHTML = `
                <button class="chip" data-page="-1" ${newerOff ? 'disabled' : ''}>Newer</button>
                <span></span>
                <button class="chip" data-page="1" ${olderOff ? 'disabled' : ''}>Older</button>
            `;
        }

        function renderStory(detail) {
            const cached = sessionCache.find((row) => row.id === (detail.session && detail.session.id)) || {};
            const session = { ...cached, ...detail.session };
            const events = storyEvents(detail.events);
            const kind = visitKind(session);
            $('detail').innerHTML = `
                <div class="story-hero">
                    <p class="eyebrow">${esc(clock(session.started_at))} · ${esc(visitLine(session))}</p>
                    <h2 class="display">${esc(guestLabel(session))}</h2>
                    <div class="meta">
                        <span class="badge ${kind.className}">${kind.label}</span>
                        <span>${icon('timer')} ${esc(duration(session.started_at, session.ended_at))}</span>
                        <span>${deviceIcon(session.device)} ${esc(session.browser || 'browser')} on ${esc(session.os || session.device || 'the web')}</span>
                        <span>${icon('link')} from ${esc(prettyHost(session.referrer))}</span>
                    </div>
                </div>
                <div class="timeline">
                    ${events.map((event) => `
                        <article class="moment">
                            <time>${esc(clock(event.ts))}</time>
                            <p>${eventIcon(event.action)} ${esc(momentCopy(event))}</p>
                        </article>
                    `).join('') || '<p class="empty">This guest has no story yet.</p>'}
                </div>
            `;
        }

        async function openVisit(sessionId) {
            selectedId = sessionId;
            document.querySelectorAll('.visit').forEach((node) => {
                node.classList.toggle('is-on', node.dataset.id === sessionId);
            });
            renderStory(await api(`/analytics/sessions/${encodeURIComponent(sessionId)}`));
        }

        async function loadBoard() {
            const params = new URLSearchParams({ range, limit: String(PAGE), offset: String(offset) });
            if (device) params.set('device', device);
            const [overview, list] = await Promise.all([
                api(`/analytics/overview?range=${range}`),
                api(`/analytics/sessions?${params}`),
            ]);
            const sessions = withLocalGuests(list.sessions || []);
            sessionCache = sessions;
            renderSummary(overview);
            renderVisits(sessions, list.total);
            if (!sessions.filter(matchesQuery).length) {
                $('detail').innerHTML = '<p class="empty">Nothing to read in this window.</p>';
                return;
            }
            const stillThere = sessions.some((session) => session.id === selectedId);
            await openVisit(stillThere ? selectedId : sessions.filter(matchesQuery)[0].id);
        }

        async function unlock(nextToken) {
            token = nextToken;
            await api(`/analytics/overview?range=${range}`);
            localStorage.setItem(TOKEN_KEY, token);
            sessionStorage.removeItem(TOKEN_KEY);
            document.body.classList.add('is-open');
            await loadBoard();
        }

        function lockRoom() {
            localStorage.removeItem(TOKEN_KEY);
            sessionStorage.removeItem(TOKEN_KEY);
            token = '';
            selectedId = '';
            document.body.classList.remove('is-open');
            $('tokenInput').value = '';
            $('gateError').textContent = '';
            $('tokenInput').focus();
        }

        $('gateForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            $('gateError').textContent = '';
            try {
                await unlock($('tokenInput').value.trim());
            } catch (err) {
                $('gateError').textContent = err.message === 'Unauthorized'
                    ? 'That password did not match.'
                    : err.message;
            }
        });

        $('ranges').addEventListener('click', async (event) => {
            const chip = event.target.closest('[data-range]');
            if (!chip) return;
            range = chip.dataset.range;
            $('ranges').querySelectorAll('.chip').forEach((node) => node.classList.toggle('is-on', node === chip));
            offset = 0;
            selectedId = '';
            await loadBoard();
        });

        $('devices').addEventListener('click', async (event) => {
            const chip = event.target.closest('[data-device]');
            if (!chip) return;
            device = chip.dataset.device;
            $('devices').querySelectorAll('.chip').forEach((node) => node.classList.toggle('is-on', node === chip));
            offset = 0;
            selectedId = '';
            await loadBoard();
        });

        $('searchInput').addEventListener('input', (event) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(async () => {
                query = event.target.value.trim();
                await loadBoard();
            }, 200);
        });

        $('pager').addEventListener('click', async (event) => {
            const button = event.target.closest('[data-page]');
            if (!button || button.disabled) return;
            offset = Math.max(0, offset + (Number(button.dataset.page) * PAGE));
            selectedId = '';
            await loadBoard();
        });

        $('visits').addEventListener('click', async (event) => {
            const row = event.target.closest('[data-id]');
            if (!row) return;
            await openVisit(row.dataset.id);
        });

        $('lockBtn').addEventListener('click', lockRoom);

        const params = new URLSearchParams(location.search);
        if (params.get('token')) {
            history.replaceState({}, '', location.pathname);
            unlock(params.get('token')).catch((err) => {
                $('gateError').textContent = err.message;
            });
        } else if (token) {
            unlock(token).catch(() => lockRoom());
        }
    </script>
</body>
</html>
