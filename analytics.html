<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <title>Visits — ReelsFolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Momo+Trust+Display&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👋</text></svg>">
    <style>
        :root {
            --ink: #000000;
            --panel: rgba(255, 255, 255, 0.04);
            --line: rgba(255, 236, 210, 0.1);
            --cream: rgba(255, 244, 226, 0.92);
            --mute: rgba(255, 236, 210, 0.5);
            --up: #8fd4a8;
            --down: #efb4a4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            background: var(--ink);
            color: var(--cream);
            font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: #000;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.28;
            mix-blend-mode: soft-light;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        button, input { font: inherit; color: inherit; }
        button { cursor: pointer; }

        .gate, .app { position: relative; z-index: 1; min-height: 100vh; }
        .shell { width: calc(100% - 40px); max-width: none; margin: 0 auto; padding: 18px 0 40px; }

        .gate { display: grid; place-items: center; padding: 32px 20px; }
        .gate-card {
            width: min(420px, 100%);
            padding: 36px 32px 32px;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 42%), #111;
            box-shadow: inset 0 1px 0 rgba(255, 244, 226, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.35), 0 24px 50px rgba(0, 0, 0, 0.35);
        }
        .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); }
        .display, .gate-card h1, .kpis b, .detail h1, .brand {
            font-family: 'Momo Trust Display', Inter, serif;
            font-weight: 400;
            letter-spacing: -0.03em;
        }
        .gate-card h1 { font-size: 42px; margin: 14px 0 10px; line-height: 0.95; }
        .lede { color: var(--mute); line-height: 1.55; font-size: 14px; }
        .gate-form { display: grid; gap: 12px; margin-top: 28px; }
        input[type="password"] {
            height: 48px;
            padding: 0 14px;
            border: 0;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.28);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.28), inset 0 0 0 1px rgba(255, 236, 210, 0.08);
            outline: none;
        }
        input[type="password"]:focus {
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.28), inset 0 0 0 1px rgba(143, 212, 168, 0.4);
        }
        .stone {
            height: 48px;
            width: 100%;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(180deg, #2a2a2a, #161616);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 0 1px rgba(0, 0, 0, 0.3), 0 10px 18px rgba(0, 0, 0, 0.22);
        }
        .stone[disabled] { opacity: 0.6; }
        .error { min-height: 1.2em; color: var(--down); font-size: 13px; }

        .app { display: none; }
        body.is-open .gate { display: none; }
        body.is-open .app { display: block; }

        header.top {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }
        .brand { font-size: 26px; line-height: 0.95; }
        .controls { display: flex; align-items: center; gap: 8px; }
        .ranges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .chip, .lock, .pager button, .back {
            height: 34px;
            padding: 0 12px;
            border: 0;
            border-radius: 999px;
            background: rgba(255, 244, 226, 0.05);
            color: var(--mute);
            box-shadow: inset 0 0 0 1px rgba(255, 236, 210, 0.08);
        }
        .chip.is-on {
            color: var(--cream);
            background: rgba(143, 212, 168, 0.14);
            box-shadow: inset 0 0 0 1px rgba(143, 212, 168, 0.28);
        }
        .lock { width: 34px; padding: 0; display: grid; place-items: center; }

        .kpis, .section {
            border-radius: 14px;
            background: var(--panel);
            box-shadow: inset 0 1px 0 rgba(255, 244, 226, 0.06), inset 0 0 0 1px var(--line);
        }
        .kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .kpis article { padding: 12px 16px 11px; box-shadow: 1px 0 0 var(--line); }
        .kpis article:last-child { box-shadow: none; }
        .kpis p { color: var(--mute); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
        .kpis b { display: block; margin: 4px 0 4px; font-size: 22px; }
        .delta { color: var(--mute); font-size: 12px; }
        .delta.is-up { color: var(--up); }
        .delta.is-down { color: var(--down); }

        .section { padding: 14px 16px 12px; margin-bottom: 10px; }
        .section h2 { font-size: 13px; font-weight: 500; margin-bottom: 10px; }

        .overview {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .overview > .section { margin-bottom: 0; }

        .workspace {
            display: grid;
            grid-template-columns: minmax(420px, 0.95fr) 1.15fr;
            gap: 10px;
            align-items: start;
        }
        .workspace > .section {
            margin-bottom: 0;
            min-height: 360px;
            max-height: calc(100vh - 220px);
            overflow: auto;
            position: sticky;
            top: 12px;
        }

        .chart { width: 100%; height: 120px; display: block; }
        .chart-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: var(--mute);
            font-size: 12px;
        }

        .split { display: contents; }
        .split > div {
            border-radius: 14px;
            padding: 14px 16px 12px;
            background: var(--panel);
            box-shadow: inset 0 1px 0 rgba(255, 244, 226, 0.06), inset 0 0 0 1px var(--line);
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 0;
            box-shadow: inset 0 -1px 0 var(--line);
        }
        .stat-row:last-child { box-shadow: none; }
        .stat-row span { color: var(--mute); }

        .guests button {
            width: 100%;
            display: grid;
            grid-template-columns: 78px 52px 72px 1fr auto;
            gap: 10px;
            align-items: baseline;
            padding: 8px 6px;
            text-align: left;
            border: 0;
            background: transparent;
            color: var(--cream);
            box-shadow: inset 0 -1px 0 var(--line);
            border-radius: 8px;
            font-size: 12px;
        }
        .guests button:hover { background: rgba(255, 244, 226, 0.05); }
        .guests button.is-on {
            background: rgba(255, 244, 226, 0.08);
            box-shadow: inset 0 -1px 0 var(--line);
        }
        .path { color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tag {
            font-size: 10px;
            letter-spacing: 0.08em;
            padding: 3px 7px;
            border-radius: 999px;
            color: rgba(143, 212, 168, 0.9);
            box-shadow: inset 0 0 0 1px rgba(143, 212, 168, 0.22);
        }

        .detail h1 { font-size: 26px; margin: 4px 0 8px; }
        .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--mute); margin-bottom: 16px; font-size: 12px; }

        .timeline { position: relative; padding-left: 18px; }
        .timeline::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 6px;
            bottom: 6px;
            width: 1px;
            background: rgba(255, 236, 210, 0.12);
        }
        .moment { position: relative; padding: 0 0 12px 16px; }
        .moment::before {
            content: '';
            position: absolute;
            left: -16px;
            top: 8px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6f9f80;
            box-shadow: 0 0 0 3px rgba(111, 159, 128, 0.18);
        }
        .moment time { display: block; color: rgba(255, 236, 210, 0.3); font-size: 11px; margin-bottom: 4px; }

        .empty { color: var(--mute); padding: 12px 0; }
        .pager { display: flex; justify-content: space-between; padding-top: 14px; }
        .pager button:disabled { opacity: 0.35; cursor: default; }

        @media (max-width: 980px) {
            header.top { display: grid; }
            .overview, .workspace, .kpis, .guests button { grid-template-columns: 1fr; }
            .kpis article { box-shadow: inset 0 -1px 0 var(--line); }
            .path { grid-column: 1 / -1; }
            .workspace > .section { min-height: 0; }
        }
    </style>
</head>
<body>
    <main class="gate" id="gate">
        <section class="gate-card">
            <p class="eyebrow">Private</p>
            <h1>Visits</h1>
            <p class="lede">Use the password you set on the worker. This browser will remember it until you lock it.</p>
            <form class="gate-form" id="gateForm">
                <input id="tokenInput" type="password" name="password" autocomplete="current-password" placeholder="Password" required>
                <button class="stone" type="submit">Open</button>
                <p class="error" id="gateError"></p>
            </form>
        </section>
    </main>

    <div class="app" id="app">
        <div class="shell">
            <div class="board" id="board">
                <header class="top">
                    <div>
                        <p class="eyebrow">ReelsFolio</p>
                        <div class="brand">Who stopped by</div>
                    </div>
                    <div class="controls">
                        <div class="ranges" id="ranges">
                            <button class="chip is-on" data-range="7d">7 days</button>
                            <button class="chip" data-range="30d">30 days</button>
                            <button class="chip" data-range="all">All</button>
                        </div>
                        <button class="lock" id="lockBtn" type="button" aria-label="Lock">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                                <rect x="4" y="6" width="8" height="7" rx="1"/>
                                <path d="M6 6V4.5a2 2 0 0 1 4 0V6"/>
                            </svg>
                        </button>
                    </div>
                </header>

                <section class="kpis" id="kpis"></section>

                <div class="overview">
                    <section class="section">
                        <h2>Visitors</h2>
                        <div id="chart"></div>
                    </section>
                    <div class="split" id="splits"></div>
                </div>

                <div class="workspace">
                    <section class="section">
                        <h2>Recent visitors</h2>
                        <div class="guests" id="guests"></div>
                        <div class="pager" id="pager"></div>
                    </section>
                    <section class="section detail" id="detail">
                        <p class="empty">Pick a guest from the list.</p>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WORKER = 'https://reelsfolio-likes.vibhoresinghal.workers.dev';
        const TOKEN_KEY = 'rf_analytics_token';
        const PAGE = 20;
        const CLIP_SHORT = {
            'landing-video': 'Intro',
            landing: 'Intro',
            t1v1: 'PayZapp',
            t1v2: 'Growth',
            t1v3: 'Unicorn',
            t1v4: 'Neo',
            t2v1: 'HueRex',
            t3v1: 'Veronica',
            t4v1: 'Sakleshpur',
            t4v2: 'Delhi',
            t4v3: 'Ladakh',
        };
        const CATEGORIES = {
            landing: 'Landing',
            zeta: 'Zeta',
            personal: 'Personal',
            films: 'Films',
            life: 'Life',
        };

        let token = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || '';
        let range = '7d';
        let offset = 0;
        let selectedId = '';
        let sessionCache = [];

        const $ = (id) => document.getElementById(id);

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[char]));
        }

        function clipName(id) {
            return CLIP_SHORT[id] || id || 'Clip';
        }

        function campaignFromPath(path) {
            if (!path || !String(path).includes('?')) return '';
            try {
                const query = new URLSearchParams(String(path).split('?')[1]);
                return (query.get('utm_source') || query.get('src') || query.get('from') || '').trim();
            } catch {
                return '';
            }
        }

        function hostOf(value) {
            if (!value) return '';
            try { return new URL(value, 'https://reelsfolio.local').hostname.replace(/^www\./, '').toLowerCase(); }
            catch { return String(value).toLowerCase(); }
        }

        function prettyCampaign(value) {
            const name = String(value || '').toLowerCase();
            if (name.includes('linkedin')) return 'LinkedIn';
            if (name.includes('twitter') || name === 'x') return 'Twitter';
            return value;
        }

        function arrivalLabel(referrer, landingPath) {
            const campaign = campaignFromPath(landingPath);
            if (campaign) return prettyCampaign(campaign);
            const referrerHost = hostOf(referrer);
            if (referrerHost.includes('linkedin')) return 'LinkedIn';
            if (referrerHost.includes('twitter') || referrerHost === 'x.com' || referrerHost === 't.co') return 'Twitter';
            if (referrerHost === 'localhost' || referrerHost === '127.0.0.1') return 'Local';
            if (referrerHost) return referrerHost;
            const landHost = hostOf(landingPath);
            if (landHost === 'localhost' || landHost === '127.0.0.1') return 'Local';
            return 'Direct';
        }

        function clock(ts) {
            return new Date(ts).toLocaleString(undefined, {
                month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
            });
        }

        function watchLabel(seconds) {
            const n = Math.round(Number(seconds) || 0);
            if (n < 60) return `${n}s`;
            return `${Math.floor(n / 60)}m ${String(n % 60).padStart(2, '0')}s`;
        }

        function duration(start, end) {
            return watchLabel(Math.max(0, ((end || start) - start) / 1000));
        }

        function deltaLabel(value) {
            if (value === null || value === undefined) return '';
            if (value > 0) return `<span class="delta is-up">↑ ${value}%</span>`;
            if (value < 0) return `<span class="delta is-down">↓ ${Math.abs(value)}%</span>`;
            return `<span class="delta">0%</span>`;
        }

        function shares(rows, key = 'n') {
            const total = rows.reduce((sum, row) => sum + (Number(row[key]) || 0), 0);
            return rows.map((row) => ({
                ...row,
                pct: total ? Math.round((Number(row[key]) / total) * 100) : 0,
            }));
        }

        function fillDays(daily) {
            const count = range === '30d' || range === 'all' ? 14 : 7;
            const map = new Map((daily || []).map((row) => [row.day, Number(row.n) || 0]));
            const days = [];
            for (let i = count - 1; i >= 0; i -= 1) {
                const date = new Date();
                date.setHours(0, 0, 0, 0);
                date.setDate(date.getDate() - i);
                const key = date.toISOString().slice(0, 10);
                days.push({
                    day: key,
                    label: date.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 3),
                    n: map.get(key) || 0,
                });
            }
            return days;
        }

        function stepPath(days) {
            const width = 700;
            const height = 140;
            const max = Math.max(1, ...days.map((day) => day.n));
            const gap = days.length > 1 ? width / (days.length - 1) : width;
            const points = days.map((day, index) => ({
                x: index * gap,
                y: height - (day.n / max) * (height - 12) - 6,
            }));
            let d = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i += 1) {
                d += ` H ${points[i].x} V ${points[i].y}`;
            }
            return { d, width, height };
        }

        async function api(path) {
            const res = await fetch(`${WORKER}${path}`, {
                headers: { Authorization: `Bearer ${token}` },
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `Could not load (${res.status})`);
            return data;
        }

        function lastLine(session) {
            const payload = session.last_payload || {};
            switch (session.last_action) {
                case 'video_view':
                case 'video_heartbeat': return clipName(payload.videoId);
                case 'outbound_click': return payload.label || 'link';
                case 'tab_visit': return CATEGORIES[payload.category] || payload.category || 'tab';
                case 'grid_open': return 'Grid';
                default: return 'Intro';
            }
        }

        function momentCopy(event) {
            const p = event.payload || {};
            switch (event.action) {
                case 'session_start': return 'Opened the folio';
                case 'video_view': return `Opened ${clipName(p.videoId)}`;
                case 'video_heartbeat': return `Watched ${clipName(p.videoId)} for ${watchLabel(p.seconds)}`;
                case 'like_toggle': return p.liked ? `Liked ${clipName(p.videoId)}` : `Unliked ${clipName(p.videoId)}`;
                case 'tab_visit': return `Moved into ${CATEGORIES[p.category] || p.category || 'another chapter'}`;
                case 'grid_open': return 'Opened the grid';
                case 'outbound_click': return `Tapped ${p.label || 'a link'}`;
                default: return event.action;
            }
        }

        function storyEvents(events) {
            const rows = events || [];
            const watchByClip = new Map();
            for (const event of rows) {
                if (event.action !== 'video_heartbeat') continue;
                const id = event.payload && event.payload.videoId;
                if (!id) continue;
                const prev = watchByClip.get(id) || { seconds: 0, ts: event.ts };
                prev.seconds += Number(event.payload.seconds) || 0;
                prev.ts = event.ts;
                watchByClip.set(id, prev);
            }
            const usedWatch = new Set();
            let sawArrival = false;
            const out = [];
            for (const event of rows) {
                if (event.action === 'session_start') {
                    if (sawArrival) continue;
                    sawArrival = true;
                    out.push(event);
                    continue;
                }
                if (event.action === 'video_heartbeat') continue;
                if (event.action === 'video_view') {
                    const id = event.payload && event.payload.videoId;
                    const watch = id && watchByClip.get(id);
                    if (watch && !usedWatch.has(id)) {
                        usedWatch.add(id);
                        out.push({ ts: watch.ts, action: 'video_heartbeat', payload: { videoId: id, seconds: watch.seconds } });
                    } else if (!watch) {
                        out.push(event);
                    }
                    continue;
                }
                out.push(event);
            }
            for (const [id, watch] of watchByClip) {
                if (usedWatch.has(id)) continue;
                out.push({ ts: watch.ts, action: 'video_heartbeat', payload: { videoId: id, seconds: watch.seconds } });
            }
            return out.sort((a, b) => a.ts - b.ts);
        }

        function withLocalGuests(sessions) {
            const first = new Map();
            for (const session of [...sessions].sort((a, b) => a.started_at - b.started_at)) {
                const vid = session.visitor_id || session.id;
                if (!first.has(vid)) first.set(vid, session.started_at);
            }
            const order = [...first.entries()].sort((a, b) => a[1] - b[1] || String(a[0]).localeCompare(String(b[0])));
            const guestByVid = new Map(order.map((entry, index) => [entry[0], index + 1]));
            return sessions.map((session) => ({
                ...session,
                guest_number: session.guest_number || guestByVid.get(session.visitor_id || session.id),
                visit_number: session.visit_number || 1,
                path: session.path || [],
            }));
        }

        function pathLabel(session) {
            const clips = (session.path || []).map(clipName);
            if (clips.length) return [...new Set(clips)].join(' → ');
            return lastLine(session);
        }

        function tagLabel(session) {
            if (session.is_tab) return 'TAB';
            if ((session.visit_number || 1) > 1) return 'BACK';
            return 'NEW';
        }

        function renderKpis(overview) {
            const watchSeconds = overview.watchSeconds
                ?? (overview.watch || []).reduce((sum, row) => sum + (Number(row.seconds) || 0), 0);
            const deltas = overview.deltas || {};
            const cells = [
                ['VISITORS', overview.visitors || overview.visits || 0, deltas.visitors],
                ['WATCH TIME', watchSeconds ? watchLabel(watchSeconds) : '0s', deltas.watch],
                ['AVG. SESSION', overview.avgSessionMs ? watchLabel(overview.avgSessionMs / 1000) : '—', deltas.avgSession],
                ['LINKEDIN CLICKS', overview.linkedin != null ? overview.linkedin : (((overview.outbound || []).find((row) => row.label === 'linkedin') || {}).n || 0), deltas.linkedin],
            ];
            $('kpis').innerHTML = cells.map(([label, value, delta]) => (
                `<article><p>${label}</p><b>${esc(value)}</b>${deltaLabel(delta)}</article>`
            )).join('');
        }

        function renderChart(overview) {
            const days = fillDays(overview.daily || []);
            const { d, width, height } = stepPath(days);
            $('chart').innerHTML = `
                <svg class="chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">
                    <path d="${d}" fill="none" stroke="#8fd4a8" stroke-width="2" stroke-linejoin="round"/>
                </svg>
                <div class="chart-labels">${days.map((day) => `<span>${esc(day.label)}</span>`).join('')}</div>
            `;
        }

        function arrivalRows(overview, sessions) {
            const outboundLabels = new Set(['linkedin', 'resume', 'x', 'email', 'link']);
            const fromApi = Array.isArray(overview.sources) ? overview.sources : [];
            const looksLikeClicks = fromApi.length && fromApi.every((row) => (
                outboundLabels.has(String(row.label || '').toLowerCase())
            ));
            if (fromApi.length && !looksLikeClicks) return fromApi;
            const counts = {};
            for (const session of sessions || []) {
                const label = arrivalLabel(session.referrer, session.landing_path);
                counts[label] = (counts[label] || 0) + 1;
            }
            return Object.entries(counts)
                .map(([label, n]) => ({ label, n }))
                .sort((a, b) => b.n - a.n);
        }

        function renderSplits(overview, sessions) {
            const watch = shares(overview.watch || [], 'seconds').slice(0, 4);
            const sources = shares(arrivalRows(overview, sessions)).slice(0, 4);
            const list = (rows, nameFn) => rows.length
                ? rows.map((row) => `<div class="stat-row"><p>${esc(nameFn(row))}</p><span>${row.pct}%</span></div>`).join('')
                : '<p class="empty">Nothing yet.</p>';
            $('splits').innerHTML = `
                <div>
                    <h2>What they're watching</h2>
                    ${list(watch, (row) => clipName(row.videoId))}
                </div>
                <div>
                    <h2>How they arrived</h2>
                    ${list(sources, (row) => row.label)}
                </div>
            `;
        }

        function renderGuests(sessions, total) {
            if (!sessions.length) {
                $('guests').innerHTML = '<p class="empty">No visitors in this window.</p>';
            } else {
                $('guests').innerHTML = sessions.map((session) => `
                    <button type="button" class="${session.id === selectedId ? 'is-on' : ''}" data-id="${esc(session.id)}">
                        <span>Guest ${esc(session.guest_number || '—')}</span>
                        <span>${esc(duration(session.started_at, session.ended_at))}</span>
                        <span>${esc(session.os || session.device || '—')}</span>
                        <span class="path">${esc(pathLabel(session))}</span>
                        <span class="tag">${tagLabel(session)}</span>
                    </button>
                `).join('');
            }
            const known = Number(total) || sessions.length;
            $('pager').innerHTML = `
                <button data-page="-1" ${offset <= 0 ? 'disabled' : ''}>Newer</button>
                <button data-page="1" ${offset + sessions.length >= known ? 'disabled' : ''}>Older</button>
            `;
        }

        function renderStory(detail) {
            const cached = sessionCache.find((row) => row.id === detail.session.id) || {};
            const session = { ...cached, ...detail.session };
            const events = storyEvents(detail.events);
            $('detail').innerHTML = `
                <p class="eyebrow">${esc(clock(session.started_at))}</p>
                <h1>Guest ${esc(session.guest_number || '')}</h1>
                <div class="meta">
                    <span class="tag">${tagLabel(session)}</span>
                    <span>${esc(duration(session.started_at, session.ended_at))}</span>
                    <span>${esc(session.os || session.device || '')}</span>
                    <span>${esc(pathLabel(session))}</span>
                    <span>from ${esc(arrivalLabel(session.referrer, session.landing_path))}</span>
                </div>
                <div class="timeline">
                    ${events.map((event) => `
                        <article class="moment">
                            <time>${esc(clock(event.ts))}</time>
                            <p>${esc(momentCopy(event))}</p>
                        </article>
                    `).join('') || '<p class="empty">No story yet.</p>'}
                </div>
            `;
        }

        async function openGuest(sessionId, force = false) {
            if (!force && sessionId === selectedId && $('detail').querySelector('h1')) return;
            selectedId = sessionId;
            document.querySelectorAll('.guests button').forEach((node) => {
                node.classList.toggle('is-on', node.dataset.id === sessionId);
            });
            renderStory(await api(`/analytics/sessions/${encodeURIComponent(sessionId)}`));
        }

        async function loadBoard() {
            const params = new URLSearchParams({ range, limit: String(PAGE), offset: String(offset) });
            const [overview, list] = await Promise.all([
                api(`/analytics/overview?range=${range}`),
                api(`/analytics/sessions?${params}`),
            ]);
            const sessions = withLocalGuests(list.sessions || []);
            sessionCache = sessions;
            renderKpis(overview);
            renderChart(overview);
            renderSplits(overview, sessions);
            renderGuests(sessions, list.total);
            if (!sessions.length) {
                $('detail').innerHTML = '<p class="empty">No guests in this window.</p>';
                return;
            }
            const stillThere = sessions.some((session) => session.id === selectedId);
            await openGuest(stillThere ? selectedId : sessions[0].id, true);
        }

        async function unlock(nextToken) {
            token = (nextToken || '').trim();
            if (!token) throw new Error('Enter the password.');
            await api(`/analytics/overview?range=${range}`);
            localStorage.setItem(TOKEN_KEY, token);
            sessionStorage.removeItem(TOKEN_KEY);
            await loadBoard();
            document.body.classList.add('is-open');
            history.replaceState({}, '', location.pathname);
        }

        function lockRoom() {
            localStorage.removeItem(TOKEN_KEY);
            sessionStorage.removeItem(TOKEN_KEY);
            token = '';
            document.body.classList.remove('is-open');
            selectedId = '';
            $('tokenInput').value = '';
            $('gateError').textContent = '';
            $('tokenInput').focus();
        }

        $('gateForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = $('gateForm').querySelector('button');
            $('gateError').textContent = '';
            button.disabled = true;
            button.textContent = 'Opening…';
            try {
                await unlock($('tokenInput').value.trim());
            } catch (err) {
                document.body.classList.remove('is-open');
                $('gateError').textContent = err.message === 'Unauthorized'
                    ? 'That password did not match.'
                    : (err.message || 'Could not open.');
            } finally {
                button.disabled = false;
                button.textContent = 'Open';
            }
        });

        $('ranges').addEventListener('click', async (event) => {
            const chip = event.target.closest('[data-range]');
            if (!chip) return;
            range = chip.dataset.range;
            $('ranges').querySelectorAll('.chip').forEach((node) => node.classList.toggle('is-on', node === chip));
            offset = 0;
            await loadBoard();
        });

        $('pager').addEventListener('click', async (event) => {
            const button = event.target.closest('[data-page]');
            if (!button || button.disabled) return;
            offset = Math.max(0, offset + (Number(button.dataset.page) * PAGE));
            await loadBoard();
        });

        $('guests').addEventListener('click', async (event) => {
            const row = event.target.closest('[data-id]');
            if (!row) return;
            await openGuest(row.dataset.id);
        });

        $('lockBtn').addEventListener('click', lockRoom);

        const params = new URLSearchParams(location.search);
        const urlSecret = params.get('token') || params.get('password');
        if (urlSecret) {
            $('tokenInput').value = urlSecret;
            unlock(urlSecret).catch((err) => {
                $('gateError').textContent = err.message === 'Unauthorized'
                    ? 'That password did not match.'
                    : (err.message || 'Could not open.');
            });
        } else if (token) {
            unlock(token).catch(() => lockRoom());
        }
    </script>
</body>
</html>
